<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0D0D0D">
<title>Iron Mind Mentoring</title>
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root { --ink:#0D0D0D; --paper:#F8F8F5; --line:#DDDDDA; --mute:#888884; --soft:#F0F0EB; --good:#15803d; --warn:#b45309; --bad:#b91c1c; }
  body { font-family:'DM Sans',sans-serif; background:var(--paper); color:var(--ink); }
  .fd { font-family:'Bebas Neue',sans-serif; letter-spacing:.06em; }
  .fs { font-family:'DM Serif Display',serif; }
  input, textarea, select, button { font-family:'DM Sans',sans-serif; }
  .lbl { display:block; font-size:.65rem; font-weight:700; letter-spacing:.15em; text-transform:uppercase; color:var(--mute); margin-bottom:.25rem; }
  th.lbl, td.lbl { display:table-cell; }
  .inp { width:100%; border:1px solid var(--line); padding:.5rem .75rem; font-size:.875rem; color:var(--ink); background:#fff; transition:border-color .2s; }
  .inp:focus { outline:none; border-color:var(--ink); }
  .card { background:#fff; border:1px solid var(--line); padding:1.25rem; }

  .btn:hover { background:#333; }
  .btn-o { border:1px solid var(--line); color:var(--mute); font-size:.7rem; font-weight:700; letter-spacing:.15em; text-transform:uppercase; padding:.5rem 1rem; background:#fff; white-space:nowrap; transition:all .2s; }
  .btn-o:hover { border-color:var(--ink); color:var(--ink); }
  .chip { display:inline-block; font-size:.62rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase; padding:.15rem .5rem; background:var(--soft); color:var(--ink); }
  .tab { font-size:.7rem; font-weight:700; letter-spacing:.15em; text-transform:uppercase; padding:.5rem 1rem; white-space:nowrap; border:1px solid var(--line); background:#fff; color:var(--mute); }
  .tab.on { background:var(--ink); color:#F5F5F0; border-color:var(--ink); }
  .nav a { font-size:.7rem; font-weight:700; letter-spacing:.15em; text-transform:uppercase; color:#AAAAAA; padding:.4rem .2rem; border-bottom:2px solid transparent; cursor:pointer; white-space:nowrap; }
  .nav a.on, .nav a:hover { color:#fff; border-color:#fff; }
  .scroll-x { overflow-x:auto; scrollbar-width:none; }
  .scroll-x::-webkit-scrollbar { display:none; }
  .track { position:relative; height:22px; }
  .track .rail { position:absolute; left:0; right:0; top:10px; height:2px; background:var(--soft); }
  .track .seg { position:absolute; top:10px; height:2px; background:var(--ink); }
  .track .dot { position:absolute; top:4px; width:14px; height:14px; margin-left:-7px; border-radius:50%; border:2px solid #fff; cursor:default; }
  .day { width:100%; aspect-ratio:1; border:1px solid var(--line); font-size:.6rem; font-weight:700; display:flex; align-items:center; justify-content:center; cursor:pointer; user-select:none; background:#fff; color:var(--mute); }
  .day.d1 { background:var(--ink); color:#fff; border-color:var(--ink); }
  .day.d2 { background:repeating-linear-gradient(45deg,#fff,#fff 3px,#e5e5e0 3px,#e5e5e0 6px); color:var(--mute); }
  input[type=range] { accent-color:var(--ink); }
  .toast { position:fixed; bottom:1.5rem; right:1.5rem; background:var(--ink); color:#fff; font-size:.7rem; font-weight:700; letter-spacing:.15em; text-transform:uppercase; padding:.8rem 1.2rem; z-index:200; max-width:calc(100vw - 3rem); }
  @media print {
    .no-print { display:none !important; }
    body { background:#fff; }
    #app-header { display:none !important; }
    .print-only { display:block !important; }
    .card { border:none; padding:0; }
  }
</style>

<script>
// ═══════════════════════════════════════════════════════════════

const PROGS = {
  ownit_boys:  { name:'OWN IT — Boys',  short:'OWN IT', who:'Teens · 6-week transformation', dims:['Confidence','Discipline','Focus','Energy','Resilience','Organisation','Ownership','Communication'], wheel:true, weeks:OWN_IT_WEEKS },
  ownit_girls: { name:'OWN IT — Girls', short:'OWN IT', who:'Teens · 6-week transformation', dims:['Confidence','Discipline','Focus','Energy','Resilience','Organisation','Ownership','Communication'], wheel:true, weeks:OWN_IT_WEEKS },
  startstrong: { name:'START STRONG — Iron Mind Academy', short:'START STRONG', who:'Ages 10–12 · introductory journal', dims:['Confidence','Focus','Habits','Energy','Relationships','Independence'], wheel:false, weeks:[
    {t:'KNOW YOUR GAME',  q:'Who am I?',                   f:'Who you are, what gives you energy and who is in your corner.', ch:'', cd:''},
    {t:'KNOW YOUR GAME',  q:'Where am I now?',             f:'Rate yourself today. Strengths, energy and your corner.', ch:'', cd:''},
    {t:'TRAIN YOUR MIND', q:'How do I handle my thoughts?', f:'Thoughts vs facts, focus, pressure and quick resets.', ch:'', cd:''},
    {t:'BUILD YOUR BASE', q:'What do I do every day?',     f:'Routines, tiny habits, courage.', ch:'', cd:''},
    {t:'BUILD YOUR BASE', q:'How do I bounce back?',       f:'Bouncing back when it goes wrong.', ch:'', cd:''},
    {t:'STEP UP',         q:'Who do I want to be?',        f:'Choices, communication, boundaries and leadership. Build your Academy toolkit.', ch:'', cd:''},
  ]},
  performit: { name:'PERFORM IT — Sports Psychology', short:'PERFORM IT', who:'Athletes · 6-week sports psychology journal', dims:['Commitment','Communication','Concentration','Control','Confidence'], wheel:false, habits:true, weeks:[
    {t:'KNOW IT',    q:'Understand your mind',  f:'The 5 C’s baseline, athlete profile, at my best / not, why I play, the athlete iceberg.', ch:'', cd:''},
    {t:'CONTROL IT', q:'Control the moment',    f:'Reactions, emotion and the 10-second reset.', ch:'', cd:''},
    {t:'FOCUS IT',   q:'Where attention goes',  f:'Cue words and attention under distraction.', ch:'', cd:''},
    {t:'BUILD IT',   q:'Practise the process',  f:'Pre-performance routine and process goals.', ch:'', cd:''},
    {t:'TRAIN IT',   q:'Pressure on purpose',   f:'Training under deliberate pressure.', ch:'', cd:''},
    {t:'PERFORM IT', q:'Take it further',       f:'Re-rate the 5 C’s and build a personal performance blueprint.', ch:'', cd:''},
  ]},
};
const PERFORM_HABITS = ['Fill in my daily check-in','Bed on time before training / competition','Use my cue word in training, not just games','Do my pre-performance routine','Reset after a mistake (10-second reset)','Ask my coach one useful question','Fuel and hydrate before I train','Notice one thing I did well today','Review a performance without judging myself','Prepare my kit / environment early','Do one rep when motivation is low','Write one way I handled pressure better'];
const WHEEL = ['Physical','School','Personal growth','Family','Friends','Career / future','Health','Hobby / sport'];
const TOOLS = [
  {k:'sigh',   n:'Physiological Sigh', d:'Double inhale, long exhale. The fastest known nervous-system reset.'},
  {k:'box',    n:'Box Breathing',      d:'In 4, hold 4, out 4, hold 4. Used before high-stakes moments.'},
  {k:'switch', n:'The Switch',         d:'A specific, physical, repeatable trigger that activates the performance identity.'},
  {k:'cue',    n:'Process Cue',        d:'One word or focus point that replaces outcome-anxiety with a clear next action.'},
  {k:'comma',  n:'The Comma',          d:'A miss is not a full stop. The reset that stops one error becoming a spiral.'},
];
const PHASES = [{k:'b',l:'Baseline',w:'1'},{k:'m',l:'Week 3',w:'3'},{k:'f',l:'Week 6',w:'6'}];
const PHASE_COL = {b:'#C4C4BE', m:'#7A7A75', f:'#0D0D0D'};
const SESSION_TYPES = {'1-1':'1:1 Mentoring','gym':'1:1 Gym / Physical',group:'Group Session',team:'Team Session',assembly:'Assembly',parent:'Parent Meeting',forum:'Open Forum',debrief:'Staff Debrief'};
const ENG = ['','Resistant','Passive','Present','Engaged','Fully invested'];
const MODELS = {a:'Model A — Monthly retainer (20,000 AED)', b:'Model B — Per student (1,000 AED / cycle)', c:'Model C — Hybrid', p:'Private 1:1'};
const SEN = {none:'None noted',adhd_dx:'ADHD — Diagnosed',adhd_sus:'ADHD — Suspected',other:'Other SEN'};

const PAR_SCALES = ['Switched on at home','Communication with family','Motivation and effort at school','Cooperation and attitude'];
const STF_SCALES = ['Behaviour in school','Engagement in lessons','Relationships with peers','Relationships with staff'];
const Q = {
  student: {
    '1': [['What brought you here?','Be honest — there are no wrong answers.'],['What do you most want to change?','School, home, sport, or how you feel.'],["What are you good at that people don't always notice?","Don't be modest."],['What does a good week look like for you?','Describe it — what would it feel like?'],['What do you want Gary to know about you?','Anything at all — this is just for Gary.'],['Anything else on your mind?','Optional.']],
    'x': [["What's gone well since we started?",'Be specific — what actually happened or changed?'],['What progress have you made toward your goal?','Even small steps count.'],['What have you enjoyed most about the sessions?','Honest answer.'],['What has been the hardest part?','Nothing is wrong to say here.'],['What else do you want to achieve before we finish?','Think big or think small.'],['Anything you want Gary to know before the next session?','Optional.']],
  },
  parent: {
    '1': [['What has prompted you to look for support now?','What has been most difficult recently?'],['What does a good week look like for {n}?','At home, at school, with friendships…'],['What have you already tried?','Counselling, school support, conversations…'],['What would success look like at the end of the programme?','What would you like to see change?'],['Anything Gary should know before the first session?','Anything that would help Gary understand {n}.']],
    'x': [['What positive changes have you noticed at home?','Behaviour, communication, attitude, effort…'],['What are you still concerned about?','Be honest — this helps Gary tailor the sessions.'],['How has {n} spoken about the sessions?','Positive or negative?'],['What would you like the next stage to focus on?','Areas, goals, challenges…'],['Anything else Gary should know?','Optional.']],
  },
  staff: {
    '1': [['What prompted the referral?','What has led to this referral?'],['What does {n} struggle with most?','Behaviour, engagement, relationships, attendance…'],["What are {n}'s strengths?",'What do they respond well to?'],['What would a positive change look like?','From your perspective.']],
    'x': [['What improvements have you observed?','In class, with peers, with staff, attitude, effort…'],['What areas are still of concern?','Be specific.'],['Any incidents or significant events Gary should know about?','Anything since the last session…'],['What should the programme prioritise next?','Academic engagement, peers, communication with staff…']],
  },
};

// ═══════════════════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════════════════
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today = () => new Date().toISOString().split('T')[0];
const uid = () => Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
const fmtDate = d => { if (!d) return '—'; const x = new Date(d); return isNaN(x) ? d : x.toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'numeric'}); };
function hash(str) { // cyrb53 — link fingerprint, not strong security
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (let i = 0; i < str.length; i++) { const ch = str.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36);
}
const b64e = o => btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const b64d = s => JSON.parse(decodeURIComponent(escape(atob(s.replace(/-/g,'+').replace(/_/g,'/')))));
function toast(msg) { const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg; document.body.appendChild(el); setTimeout(() => el.remove(), 2600); }
function copyText(t) {
  (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => toast('Copied'))
    .catch(() => { const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); toast('Copied'); });
}
function openModal(html) { $('modal-body').innerHTML = html; $('modal').style.display = 'flex'; }
function closeModal() { $('modal').style.display = 'none'; }
const num = v => (v === '' || v == null || isNaN(parseFloat(v))) ? null : parseFloat(v);
function getP(o, path) { return path.split('.').reduce((a, k) => a == null ? a : a[k], o); }
function setP(o, path, v) { const ks = path.split('.'); const last = ks.pop(); const t = ks.reduce((a, k) => (a[k] ??= {}), o); t[last] = v; }

// ═══════════════════════════════════════════════════════════════
// STATE — localStorage (migrates the previous tracker's data)
// ═══════════════════════════════════════════════════════════════
const KEY = 'imm5', OLD_KEY = 'imm4', PW_KEY = 'imm_gary_pw', DEFAULT_PW = 'IronMind2026';
let S = null;
const UI = { page:'dash', sc:null, si:null, tab:'overview' };

function blankStudent(o = {}) {
  return Object.assign({
    id: uid(), firstName:'', lastI:'', yearGroup:'', startDate:today(), referral:'', hoy:'', sen:'none',
    programme:'ownit_boys', target:24, status:'active',
    passwords:{student:'',parent:'',staff:''}, sessions:[], checkins:[], goals:[],
    metrics:{bb:'',ba:'',ab:'',aa:'',eb:'',ea:''},
    mental:{b:{},m:{},f:{}}, wheel:{b:{},f:{}},
    physical:[{name:'Plank hold',unit:'sec',lower:false,b:'',m:'',f:''},{name:'Push-ups (max)',unit:'reps',lower:false,b:'',m:'',f:''}],
    challenges:{}, daily:Array(42).fill(0), habits:{}, toolkit:{tools:{}, trigger:'', cue:'', identity:''},
    assessment:'',
  }, o);
}
function normStudent(st) {
  const b = blankStudent();
  for (const k in b) if (st[k] === undefined) st[k] = b[k];
  st.passwords = Object.assign({student:'',parent:'',staff:''}, st.passwords || {});
  st.mental = Object.assign({b:{},m:{},f:{}}, st.mental); st.wheel = Object.assign({b:{},f:{}}, st.wheel);
  st.toolkit = Object.assign({tools:{},trigger:'',cue:'',identity:''}, st.toolkit);
  if (!Array.isArray(st.daily) || st.daily.length !== 42) st.daily = Array(42).fill(0);
  if (!PROGS[st.programme]) st.programme = 'ownit_boys';
  return st;
}
function load() {
  try { S = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { S = null; }
  if (!S) {
    let old = null; try { old = JSON.parse(localStorage.getItem(OLD_KEY) || 'null'); } catch (e) {}
    S = { v:5, schools: (old && old.schools) || {}, workshops:[], settings:{}, lastBackup:null };
    if (!old) [
      {k:'gems_wac',n:'GEMS World Academy',m:'a'},{k:'gems_ws',n:'GEMS Wellington School',m:'a'},{k:'gems_dp',n:'GEMS Dubai Primary',m:'b'},
      {k:'repton',n:'Repton School Dubai',m:'c'},{k:'hartland',n:'Hartland International',m:'b'},
    ].forEach(d => S.schools[d.k] = {name:d.n, model:d.m, hoy:'', students:[]});
  }
  S.workshops ||= []; S.settings = Object.assign({name:'Gary McIntyre', email:'ironmindmentoring@gmail.com', web:'ironmindmentoring.ae', wa:''}, S.settings || {});
  if (!S.schools.private) S.schools = Object.assign({private:{name:'Private Clients (1:1)', model:'p', hoy:'', students:[]}}, S.schools);
  Object.values(S.schools).forEach(sc => { sc.students ||= []; sc.students.forEach(normStudent); });
  delete S.cs; delete S.csc;
  save();
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('Could not save — storage full?'); } }
const stu = () => (UI.sc && UI.si != null) ? S.schools[UI.sc]?.students?.[UI.si] || null : null;
function allStudents() { const out = []; Object.entries(S.schools).forEach(([k, sc]) => sc.students.forEach((st, i) => out.push({st, sc:k, si:i, school:sc.name}))); return out; }
function findById(id) { return allStudents().find(x => x.st.id === id) || null; }

// Programme week from start date
function progWeek(st) { const d = Math.floor((Date.now() - new Date(st.startDate)) / 864e5); return isNaN(d) ? 1 : Math.max(1, Math.floor(d / 7) + 1); }
const prog = st => PROGS[st.programme] || PROGS.ownit_boys;
const ciFor = (st, w, t) => (st.checkins || []).find(c => c.week === w && c.type === t);
const dailyPct = st => Math.round(st.daily.filter(x => x === 1).length / 42 * 100);
function lastSession(st) { return (st.sessions || []).map(s => s.date).sort().pop() || null; }
function dueItems(st) {
  const w = progWeek(st), out = [], p = prog(st);
  const hasB = p.dims.some(d => st.mental.b[d] != null && st.mental.b[d] !== '');
  const hasPhysB = st.physical.some(t => num(t.b) != null);
  if (st.status !== 'active') return out;
  if (!hasB) out.push({lvl:'warn', t:'Mental baseline missing'});
  if (!hasPhysB) out.push({lvl:'warn', t:'Physical baseline missing'});
  ['1','3','6'].forEach(wk => {
    if (w >= +wk) { const miss = ['student','parent','staff'].filter(t => !ciFor(st, wk, t)); if (miss.length) out.push({lvl: wk === '1' ? 'info' : 'warn', t:`Week ${wk} check-ins outstanding: ${miss.join(', ')}`, wk}); }
  });
  const ls = lastSession(st);
  if (!ls) out.push({lvl:'info', t:'No sessions logged yet'});
  else if ((Date.now() - new Date(ls)) / 864e5 > 10) out.push({lvl:'warn', t:`No session for ${Math.floor((Date.now() - new Date(ls)) / 864e5)} days`});
  if ((st.sessions || []).some(s => s.flag)) out.push({lvl:'bad', t:'Safeguarding note flagged — review'});
  return out;
}

const params = new URLSearchParams(location.search);
const ROLE = ['student','parent','staff'].includes(params.get('view')) ? params.get('view') : null;
const getGaryPw = () => localStorage.getItem(PW_KEY) || DEFAULT_PW;

function initLock() {
  if (ROLE) {
    const labels = {student:'Student Check-In', parent:'Parent Check-In', staff:'Staff Check-In'};
    $('lock-sub').textContent = labels[ROLE] + (params.get('n') ? ' · ' + params.get('n') : '');
    $('lock-label').textContent = `Enter your ${ROLE} password to continue`;
  } else {
    $('lock-label').textContent = 'Enter your password to open the dashboard';
    if (!localStorage.getItem(PW_KEY)) $('lock-hint').style.display = 'block';
    if (sessionStorage.getItem('imm_unlocked') === 'gary') return unlockGary();
  }
  setTimeout(() => $('lock-pw').focus(), 50);
}
function checkPw() {
  const pw = ($('lock-pw').value || '').trim(); if (!pw) return;
  if (ROLE) {
    const id = params.get('id'), k = params.get('k');
    let ok = id && k && hash(pw + '|' + id) === k;
    if (!ok) { // fallback: same device as Gary, or legacy links

// ─── CHARTS ───
const legend = keys => `<div class="flex gap-4 flex-wrap text-xs text-[#555] mb-3">${keys.map(k => `<span class="flex items-center gap-1.5"><span style="width:10px;height:10px;border-radius:50%;background:${PHASE_COL[k]};display:inline-block"></span>${PHASES.find(p => p.k === k).l}</span>`).join('')}</div>`;
function dumbbell(label, vals, min, max, unit = '', lower = false) {
  const pts = PHASES.map(p => ({k:p.k, l:p.l, v:num(vals[p.k])})).filter(p => p.v != null);
  const pos = v => Math.max(0, Math.min(100, (v - min) / (max - min) * 100));
  const first = pts[0], last = pts[pts.length - 1];
  const delta = pts.length > 1 ? last.v - first.v : null;
  const good = delta != null && (lower ? delta < 0 : delta > 0);
  return `<div class="grid grid-cols-[minmax(90px,140px)_1fr_64px] gap-3 items-center py-1.5">
    <span class="text-xs font-bold">${esc(label)}</span>
    <div class="track"><div class="rail"></div>
      ${pts.length > 1 ? `<div class="seg" style="left:${Math.min(pos(first.v), pos(last.v))}%;width:${Math.abs(pos(last.v) - pos(first.v))}%"></div>` : ''}
      ${pts.map(p => `<span class="dot" style="left:${pos(p.v)}%;background:${PHASE_COL[p.k]}" title="${esc(label)} — ${p.l}: ${p.v}${unit}"></span>`).join('')}
    </div>
    <span class="text-xs text-right font-bold ${good ? 'text-green-700' : 'text-[#888884]'}">${pts.length ? (delta != null ? `${first.v}→${last.v}` : `${last.v}`) + unit : '—'}${good ? ' ↑' : ''}</span>
  </div>`;
}
function dimsChart(st) {
  const p = prog(st);
  if (!p.dims.some(d => PHASES.some(ph => num(st.mental[ph.k][d]) != null))) return '<p class="text-sm text-[#888884] italic">No ratings yet. Enter the journal “Where are you now?” scores in Baseline &amp; Progress, or send the Week 1 student check-in.</p>';
  return legend(['b','m','f']) + `<div class="text-[10px] text-[#888884] grid grid-cols-[minmax(90px,140px)_1fr_64px] gap-3"><span></span><span class="flex justify-between"><span>1</span><span>10</span></span><span></span></div>` + p.dims.map(d => dumbbell(d, {b:st.mental.b[d], m:st.mental.m[d], f:st.mental.f[d]}, 1, 10)).join('');
}
function radar(st) {
  const N = WHEEL.length, R = 110, cx = 160, cy = 150;
  const pt = (i, v) => { const a = -Math.PI / 2 + i * 2 * Math.PI / N; const r = R * (v || 0) / 10; return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; };
  const has = k => WHEEL.some(w => num(st.wheel[k][w]) != null);
  const poly = (k, fill, stroke, dash) => has(k) ? `<polygon points="${WHEEL.map((w, i) => pt(i, num(st.wheel[k][w])).join(',')).join(' ')}" fill="${fill}" stroke="${stroke}" stroke-width="2" ${dash ? 'stroke-dasharray="4 3"' : ''}/>` : '';
  const rings = [2, 4, 6, 8, 10].map(v => `<polygon points="${WHEEL.map((w, i) => pt(i, v).join(',')).join(' ')}" fill="none" stroke="#ECECE8" stroke-width="1"/>`).join('');
  const spokes = WHEEL.map((w, i) => { const [x, y] = pt(i, 10); return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#ECECE8"/>`; }).join('');
  const labels = WHEEL.map((w, i) => { const [x, y] = pt(i, 12.2); const b = num(st.wheel.b[w]), f = num(st.wheel.f[w]);
    return `<text x="${x}" y="${y}" text-anchor="${Math.abs(x - cx) < 5 ? 'middle' : x > cx ? 'start' : 'end'}" dominant-baseline="middle" font-size="10" font-weight="700" fill="#0D0D0D">${esc(w)}<tspan fill="#888884" font-weight="400"> ${b ?? '–'}${f != null ? '→' + f : ''}</tspan><title>${esc(w)}: baseline ${b ?? '—'}, week 6 ${f ?? '—'}</title></text>`; }).join('');
  const dots = ['b','f'].map(k => has(k) ? WHEEL.map((w, i) => { const v = num(st.wheel[k][w]); if (v == null) return ''; const [x, y] = pt(i, v); return `<circle cx="${x}" cy="${y}" r="4" fill="${PHASE_COL[k]}" stroke="#fff" stroke-width="2"><title>${esc(w)} — ${k === 'b' ? 'Baseline' : 'Week 6'}: ${v}</title></circle>`; }).join('') : '').join('');
  return `${legend(['b','f'])}<svg viewBox="-75 0 470 300" class="w-full max-w-md mx-auto block" role="img" aria-label="Wheel of life, baseline versus week 6">${rings}${spokes}${poly('b', 'rgba(196,196,190,.35)', '#B5B5AF', true)}${poly('f', 'rgba(13,13,13,.08)', '#0D0D0D')}${dots}${labels}</svg>`;
}

  const base = location.href.split('?')[0].split('#')[0];

  const q = new URLSearchParams({view:type, id:st.id, w:week, n:st.firstName, pg:st.programme, k:hash(pw + '|' + st.id)});
  if (S.settings.wa) q.set('wa', S.settings.wa.replace(/\D/g, ''));
  if (S.settings.email) q.set('em', S.settings.email);
  return base + '?' + q.toString();
}

    const good = B != null && F != null && (lower ? F < B : F > B);

function exportData() {
  const blob = new Blob([JSON.stringify(S, null, 2)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `ironmind-backup-${today()}.json`; a.click();
  S.lastBackup = new Date().toISOString(); save(); setTimeout(render, 300);
}
function importBackup(input) {
  const f = input.files[0]; if (!f) return;
  f.text().then(t => { const d = JSON.parse(t); if (!d.schools) throw 0;
    if (!confirm('Replace ALL current data with this backup?')) return;
    localStorage.setItem(KEY, JSON.stringify(d)); load(); toast('Backup restored'); render();
  }).catch(() => toast('That file is not an Iron Mind backup'));
}
function applyCheckin(payload) {
  const hit = findById(payload.id); if (!hit) return {ok:false, msg:'No client matches this code (was the client deleted or created on another device?)'};
  const st = hit.st, ci = payload.ci;
  st.checkins = st.checkins.filter(c => !(c.week === ci.week && c.type === ci.type)); st.checkins.push(ci);
  if (ci.type === 'student') {
    const k = (PHASES.find(p => p.w === ci.week) || {}).k;
    if (k && ci.dims) Object.entries(ci.dims).forEach(([d, v]) => st.mental[k][d] = v);
    if (ci.wheel && (k === 'b' || k === 'f')) Object.entries(ci.wheel).forEach(([d, v]) => st.wheel[k][d] = v);
  }
  save(); return {ok:true, msg:`${TYPE_L[ci.type]} · Week ${ci.week} imported for ${st.firstName} ${st.lastI}.`, hit};
}
function importCodes() {
  const txt = $('imp-txt').value, codes = txt.match(/IMM1\.[A-Za-z0-9_-]+/g) || [];
  if (!codes.length) return toast('No check-in code found in that text');
  const res = codes.map(c => { try { return applyCheckin(b64d(c.slice(5))); } catch (e) { return {ok:false, msg:'A code was damaged — ask them to resend it'}; } });
  $('imp-res').innerHTML = res.map(r => `<p class="text-sm ${r.ok ? 'text-green-700' : 'text-red-700'}">${r.ok ? '✓' : '✗'} ${esc(r.msg)}</p>`).join('');
  $('imp-txt').value = '';
}
function changePw() {
  const a = $('pw1').value.trim(), b = $('pw2').value.trim();
  if (a.length < 6) return toast('Use at least 6 characters'); if (a !== b) return toast("Passwords don't match");
  localStorage.setItem(PW_KEY, a); toast('Password updated'); render();
}

    <div class="space-y-5">
      <div class="card"><p class="lbl mb-1">Backup</p><p class="text-sm text-[#888884] mb-3">Data lives in this browser only. Download a backup weekly, and use it to move to a new device.${S.lastBackup ? ` Last backup: ${fmtDate(S.lastBackup)}.` : ''}</p>
        <div class="flex gap-2 flex-wrap"><button class="btn" onclick="exportData()">Download backup</button><label class="btn-o cursor-pointer">Restore backup<input type="file" accept=".json,application/json" class="hidden" onchange="importBackup(this)"></label></div></div>
      <div class="card"><p class="lbl mb-3">Change your password</p>
        <div class="grid grid-cols-2 gap-3"><input id="pw1" type="password" class="inp" placeholder="New password"><input id="pw2" type="password" class="inp" placeholder="Repeat"></div>
        <button class="btn mt-3" onclick="changePw()">Update</button></div>
    </div></div>`);
}

// ═══════════════════════════════════════════════════════════════
// CHECK-IN FORMS (student / parent / staff)
// ═══════════════════════════════════════════════════════════════
function scaleRow(id, label) {
  return `<div class="flex items-center gap-3"><span class="flex-1 text-sm font-medium min-w-0">${esc(label)}</span>
    <input type="range" min="1" max="10" value="5" id="${id}" oninput="document.getElementById('${id}-v').textContent=this.value" class="flex-1 min-w-[90px]">
    <span id="${id}-v" class="w-8 text-center font-bold">5</span></div>`;
}
function renderForm() {
  const week = ['1','3','6'].includes(params.get('w') || params.get('week')) ? (params.get('w') || params.get('week')) : '3';
  const name = params.get('n') || 'your child';
  const p = PROGS[params.get('pg')] || null;
  const qs = Q[ROLE][week === '1' ? '1' : 'x'].map(([q, ph]) => [q.replace(/\{n\}/g, name), ph.replace(/\{n\}/g, name)]);
  const wkL = {'1':'Baseline', '3':'Mid-Point', '6':'Final'}[week];
  const intro = {
    student:'"This is your honest check-in. Nobody else sees these answers unless you choose to share them. Take your time."',
    parent:`Thank you for taking a few minutes to share what you've seen at home. Your view is an important part of how we understand ${esc(name)}'s progress.`,
    staff:`Thank you for sharing your observations. Your view helps Gary understand what is — and isn't — carrying over from sessions into school life.`,
  }[ROLE];
  let scales = '';
  if (ROLE === 'student') {
    const dims = p ? p.dims : ['Confidence','Focus','Energy','Resilience'];
    scales = `<p class="lbl border-b border-[#DDDDDA] pb-2 mb-4">Where are you now? (1 = not like me yet · 10 = this is me nearly every day)</p>
      <div class="space-y-4 mb-6">${dims.map((d, i) => scaleRow('dim-' + i, d)).join('')}</div>
      ${p?.wheel && week !== '3' ? `<p class="lbl border-b border-[#DDDDDA] pb-2 mb-4">The Wheel — how is each part of your life going? (10 = really well)</p><div class="space-y-4 mb-6">${WHEEL.map((w, i) => scaleRow('wh-' + i, w)).join('')}</div>` : ''}`;
  } else {
    const L = ROLE === 'parent' ? PAR_SCALES : STF_SCALES;
    scales = `<p class="lbl border-b border-[#DDDDDA] pb-2 mb-4">How are things right now? (1 = real concern · 10 = really positive)</p><div class="space-y-4 mb-6">${L.map((l, i) => scaleRow('sc-' + i, l)).join('')}</div>`;
  }
  $('root').innerHTML = `<div class="max-w-2xl mx-auto px-4 py-8">
    <div class="bg-white border border-[#DDDDDA] relative overflow-hidden">
      <div class="bg-[#0D0D0D] px-6 py-5"><p class="fd text-2xl text-white">IRON MIND MENTORING</p>
        <p class="text-[#AAAAAA] text-xs tracking-widest uppercase mt-1">${{student:'Student', parent:'Parent', staff:'Staff / Coach'}[ROLE]} Check-In — Week ${week} (${wkL})${p ? ' · ' + esc(p.short) : ''}</p></div>
      <div class="p-6" id="form-body">
        <p class="text-sm text-[#555] italic mb-6 leading-relaxed ${ROLE === 'student' ? 'fs' : ''}">${intro}</p>
        ${ROLE !== 'student' ? `<div class="grid grid-cols-2 gap-4 mb-5"><div><label class="lbl">Your name${ROLE === 'staff' ? ' and role' : ' (optional)'}</label><input id="f-by" class="inp" placeholder="${ROLE === 'staff' ? 'e.g. Mr Ahmed, Head of Year 8' : 'Optional'}"></div><div><label class="lbl">Date</label><input id="f-date" type="date" class="inp" value="${today()}"></div></div>` : ''}
        ${scales}
        <p class="lbl border-b border-[#DDDDDA] pb-2 mb-4">In your own words</p>
        <div class="space-y-4">${qs.map(([q, ph], i) => `<div><label class="lbl !normal-case !tracking-normal !text-sm !text-[#0D0D0D] !font-bold">${esc(q)}</label><textarea id="q-${i}" rows="3" class="inp resize-none" placeholder="${esc(ph)}"></textarea></div>`).join('')}</div>
        <button onclick="submitForm('${week}')" class="w-full mt-6 btn !py-3">Submit check-in</button>
      </div>
    </div></div>`;
}
function submitForm(week) {
  const p = PROGS[params.get('pg')] || null, name = params.get('n') || '';
  const qs = Q[ROLE][week === '1' ? '1' : 'x'];
  const ci = {type:ROLE, week, date:($('f-date')?.value || today()), by:($('f-by')?.value.trim() || undefined),
    answers:qs.map(([q], i) => ({q:q.replace(/\{n\}/g, name || 'them'), answer:$('q-' + i).value.trim()}))};
  if (ROLE === 'student') {
    const dims = p ? p.dims : ['Confidence','Focus','Energy','Resilience'];
    ci.dims = {}; dims.forEach((d, i) => ci.dims[d] = parseInt($('dim-' + i).value));
    ci.scales = dims.map(d => ({label:d, val:ci.dims[d]}));
    if (p?.wheel && week !== '3') { ci.wheel = {}; WHEEL.forEach((w, i) => ci.wheel[w] = parseInt($('wh-' + i).value)); }
  } else {
    ci.scales = (ROLE === 'parent' ? PAR_SCALES : STF_SCALES).map((l, i) => ({label:l, val:parseInt($('sc-' + i).value)}));
  }
  let id = params.get('id');
  if (!id) { const legacy = S.schools[params.get('school')]?.students?.[+params.get('student')]; id = legacy?.id; }
  const code = 'IMM1.' + b64e({id, ci});
  const local = id ? findById(id) : null;
  if (local) applyCheckin({id, ci});
  const who = {student:name, parent:`${name}'s parent`, staff:`staff re ${name}`}[ROLE];
  const text = `Iron Mind check-in — ${who} · Week ${week}\n\n${code}`;
  const wa = params.get('wa'), em = params.get('em');
  $('form-body').innerHTML = `<div class="text-center py-4">
    <p class="fd text-4xl mb-2">${ROLE === 'parent' ? 'THANK YOU.' : 'SUBMITTED.'}</p>
    ${local ? `<p class="text-sm text-[#555] mb-2">Saved straight into the tracker on this device.</p>` : `
    <p class="text-sm text-[#555] mb-6">One last step — send your answers to Gary. Tap a button below; the message is ready to go.</p>
    <div class="flex flex-col gap-3 max-w-xs mx-auto">
      ${wa ? `<a class="btn !py-3" target="_blank" rel="noopener" href="https://wa.me/${encodeURIComponent(wa)}?text=${encodeURIComponent(text)}">Send on WhatsApp</a>` : `<a class="btn !py-3" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(text)}">Send on WhatsApp</a>`}
      ${em ? `<a class="btn-o !py-3" href="mailto:${esc(em)}?subject=${encodeURIComponent('Iron Mind check-in — Week ' + week)}&body=${encodeURIComponent(text)}">Send by email</a>` : ''}
      <button class="btn-o !py-3" onclick="copyText(document.getElementById('code').value)">Copy answers</button>
    </div>
    <textarea id="code" readonly class="inp mt-5 font-mono text-[10px]" rows="3">${esc(text)}</textarea>`}
    <p class="text-sm text-[#888884] mt-5">${ROLE === 'student' ? 'Gary will read this before your next session. Good work showing up.' : 'Gary will review this before the next session.'}</p></div>`;
}

// ═══════════════════════════════════════════════════════════════

// ═══════════════════════════════════════════════════════════════
load();
initLock();
</script>
